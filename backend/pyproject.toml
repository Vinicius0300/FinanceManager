[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financas-backend"
version = "0.1.0"
description = "Backend local (sidecar) do app Finanças"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "pandas>=3.1,<4",
    # Base de fusos horários (o Windows não traz a do IANA): usada por zoneinfo.
    "tzdata>=2026.1",
    # Cliente HTTP dos providers de cotação (fork mantido do httpx; também usado pelo
    # TestClient do Starlette).
    "httpx2>=2.16,<3",
    # Exportação do histórico para Excel (.xlsx); puro Python, sem dependências pesadas.
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pandas-stubs>=3.0,<4",
    "types-openpyxl>=3.1,<4",
    "pytest-cov>=7.1,<8",
    # Apenas para o reload do uvicorn no desenvolvimento.
    "watchfiles>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S", "PT", "ANN"]
ignore = [
    "RUF001", # textos em pt-BR usam caracteres acentuados de propósito
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
