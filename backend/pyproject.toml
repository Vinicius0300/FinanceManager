[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financas-backend"
version = "0.1.0"
description = "Backend local (sidecar) do app Finanças"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16,<3",  # cliente usado pelo TestClient do Starlette
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    # Apenas para o reload do uvicorn no desenvolvimento.
    "watchfiles>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S", "PT", "ANN"]
ignore = [
    "RUF001", # textos em pt-BR usam caracteres acentuados de propósito
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
