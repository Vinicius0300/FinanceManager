# Configuração do Alembic para uso pela linha de comando (cd backend; alembic ...).
# Na inicialização do app as migrações rodam sozinhas (app/core/migracoes.py).
# O banco usado é %APPDATA%\Financas\financas.db (ou FINANCAS_DATA_DIR, se definida).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
